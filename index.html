function saveFrontSettings(){
  const inputs = {
    logo: document.getElementById("frontLogo"),
    profile: document.getElementById("frontProfile"),
    shop: document.getElementById("frontShop"),
    bg: document.getElementById("frontBg")
  };

  const taglineInput = document.getElementById("frontTagline");

  const old = JSON.parse(
    localStorage.getItem("aykFrontSettings") || "{}"
  );

  const files = {
    logo: old.logo || "",
    profile: old.profile || "",
    shop: old.shop || "",
    bg: old.bg || "",
    tagline: old.tagline || "Sayur Segar, Belanja Praktis"
  };

  files.tagline =
    taglineInput?.value.trim() ||
    "Sayur Segar, Belanja Praktis";

  const keys = Object.keys(inputs);
  let index = 0;

  function next(){
    if(index >= keys.length){
      localStorage.setItem(
        "aykFrontSettings",
        JSON.stringify(files)
      );

      fs = files;

      toast("Tampilan depan berhasil disimpan");

      setTimeout(() => {
        landing();
      }, 300);

      return;
    }

    const key = keys[index++];
    const input = inputs[key];
    const file = input?.files?.[0];

    if(!file){
      next();
      return;
    }

    if(!file.type.startsWith("image/")){
      return toast("File "+key+" harus berupa gambar");
    }

    const reader = new FileReader();

    reader.onload = function(e){
      files[key] = e.target.result;
      next();
    };

    reader.readAsDataURL(file);
  }

  next();
}

async function saveKelilingStock(){

  if(!currentKelilingSellerId){
    toast("Penjual keliling belum login");
    return;
  }

  try{

    const stokData=[];

    products.forEach(p=>{

      const input=document.getElementById(
        "kelilingStock_"+p.id
      );

      if(!input)return;

      const stok=parseFloat(input.value)||0;

      stokData.push({
        penjual_id:currentKelilingSellerId,
        produk_id:p.id,
        stok:stok
      });

    });

    if(sbReady){

      const {error}=await sb
        .from("stok_penjual_keliling")
        .upsert(
          stokData,
          {
            onConflict:"penjual_id,produk_id"
          }
        );

      if(error)throw error;

    }else{

      localStorage.setItem(
        "aykKelilingStock_"+currentKelilingSellerId,

      );

    }

    toast("Stok berhasil disimpan");

async function saveKelilingTransaction(){

  if(!currentKelilingSellerId){
    toast("Penjual keliling belum login");
    return;
  }

  const productId =
    document.getElementById("kelilingTransactionProduct").value;

  const qty =
    parseFloat(
      document.getElementById("kelilingTransactionQty").value
    ) || 0;

  const payment =
    document.getElementById("kelilingTransactionPayment").value;

  if(!productId){
    toast("Produk belum dipilih");
    return;
  }

  if(qty<=0){
    toast("Jumlah harus lebih dari 0");
    return;
  }

  const product =
    products.find(
      p=>String(p.id)===String(productId)
    );

  if(!product){
    toast("Produk tidak ditemukan");
    return;
  }

  const harga =
    Number(product.price)||0;

  const total =
    harga * qty;

  try{

    const {error}=await sb
      .from("transaksi_penjual_keliling")
      .insert({
        penjual_id:currentKelilingSellerId,
        produk_id:product.id,
        jumlah:qty,
        harga:harga,
        total:total,
        pembayaran:payment
      });

    if(error)throw error;

    toast("Transaksi berhasil disimpan");

    renderKelilingTransactions();

  }catch(e){

    toast(
      "Gagal menyimpan transaksi: "
      +e.message
    );

  }

}

  if(!available.length){
    c.innerHTML=`<div class="panel"><b>📦 Belum ada pesanan</b><p>Belum ada pesanan yang bisa diambil.</p></div>`;

async function startCourierDelivery(id){
  try{
    if(sbReady){
      const {data,error}=await sb.from("pesanan")
        .update({
          status_kurir:"diantar"
        })
        .eq("id",id)
        .eq("kurir_id",currentCourierId)
        .eq("status_kurir","diambil")
        .select()
        .maybeSingle();

      if(error)throw error;

      if(!data){
        toast("Pesanan tidak ditemukan atau sudah berubah");
        return;
      }
    }else{
      let o=orders.find(x=>String(x.id)===String(id));

      if(!o)return;

      if(String(o.courierId)!==String(currentCourierId)){
        toast("Pesanan bukan milik kurir ini");
        return;
      }

      if((o.courierStatus||"")!=="diambil"){
        toast("Status pesanan sudah berubah");
        return;
      }

      o.courierStatus="diantar";
    }

    toast("🚚 Pesanan sedang diantar");

    await loadMyCourierOrders();

  }catch(e){
    console.error(e);
    toast("Gagal memulai pengiriman: "+e.message);
  }
}
async function finishCourierOrder(id){

      id,
      currentCourierId,
      currentCourierName,
      "selesai"
    );

    toast("Pesanan selesai");
    await loadMyCourierOrders();
  }catch(e){
    toast("Gagal menyelesaikan pesanan: "+e.message);
  }
}

async function geocodeAddress(address){
  try{
    let clean=address
      .replace(/\bRT\s*\d+\s*\/?\s*RW\s*\d+\b/gi,"")
      .replace(/\bRT\s*\d+\b/gi,"")
      .replace(/\bRW\s*\d+\b/gi,"")
      .replace(/\s+/g," ")
      .trim();

    let queries=[
      clean+", Indonesia",
      "Desa "+clean+", Indonesia",
      clean.replace(/Dusun\s+/i,"")+", Indonesia"
    ];

    // Tambahkan pencarian berdasarkan bagian akhir alamat
    let parts=clean
      .split(",")
      .map(x=>x.trim())
      .filter(Boolean);

    if(parts.length>=3){
      queries.push(parts.slice(-3).join(", ")+", Indonesia");
    }

    if(parts.length>=2){
      queries.push(parts.slice(-2).join(", ")+", Indonesia");
    }

    // Untuk alamat Kemiren - Srumbung - Magelang
    queries.push("Kemiren, Srumbung, Magelang, Jawa Tengah, Indonesia");
    queries.push("Srumbung, Magelang, Jawa Tengah, Indonesia");

    queries=[...new Set(queries)];

    for(let text of queries){
      try{
        let url=
          "https://nominatim.openstreetmap.org/search"+
          "?format=jsonv2"+
          "&limit=1"+
          "&countrycodes=id"+
          "&accept-language=id"+
          "&q="+encodeURIComponent(text);

        let res=await fetch(url);

        if(!res.ok)continue;

        let data=await res.json();

        if(data && data.length){
          let lat=Number(data[0].lat);
          let lon=Number(data[0].lon);

          if(Number.isFinite(lat)&&Number.isFinite(lon)){
            return {
              lat:lat,
              lon:lon,
              display:data[0].display_name||text
            };
          }
        }
      }catch(err){
        console.error("Pencarian gagal:",text,err);
      }
    }

    return null;

  }catch(e){
    console.error("Geocoding gagal:",e);
    return null;
  }
}

  function togglePassword(id,button){
  let input=document.getElementById(id);

  if(!input)return;

  if(input.type==="password"){
    input.type="text";
    button.textContent="👁️";
}else{
    input.type="password";
    button.textContent="👁️";
  }
}

async function addCourier(){
  let nama=document.getElementById("knm").value.trim();
  let whatsapp=document.getElementById("kwa").value.trim();
  let password=document.getElementById("kpass").value;

  if(!nama){
    toast("Nama kurir wajib diisi");
    return;
  }

  if(password.length<6){
    toast("Password minimal 6 karakter");
    return;
  }

  try{
    if(sbReady){
      const {data,error}=await sb.from("kurir")
        .insert({
          nama:nama,
          whatsapp:whatsapp,
          password:password,
          aktif:true
        })
        .select()
        .single();

      if(error)throw error;

      couriers.push(data);
    }else{
      let k={
        id:Date.now(),
        nama:nama,
        whatsapp:whatsapp,
        password:password,
        aktif:true
      };
      couriers.push(k);
    }

    localStorage.setItem("aykCouriers",JSON.stringify(couriers));

    toast("Kurir berhasil ditambahkan");

    adminPage("courier",document.querySelectorAll(".tab")[3]);

  }catch(e){
    toast("Gagal tambah kurir: "+e.message);
  }
}
async function addKelilingSeller(){

  let nama=document.getElementById("knmKeliling").value.trim();
  let whatsapp=document.getElementById("kwaKeliling").value.trim();
  let username=document.getElementById("kuserKeliling").value.trim();
  let password=document.getElementById("kpassKeliling").value;
  let wilayah=document.getElementById("kwilayahKeliling").value.trim();

  if(!nama){
    toast("Nama penjual wajib diisi");
    return;
  }

  if(!username){
    toast("Username wajib diisi");
    return;
  }

  if(password.length<6){
    toast("Password minimal 6 karakter");
    return;
  }

  try{

    if(sbReady){

      const {data,error}=await sb.from("penjual_keliling")
        .insert({
          nama:nama,
          whatsapp:whatsapp,
          username:username,
          password:password,
          wilayah:wilayah,
          aktif:true
        })
        .select()
        .single();

      if(error)throw error;

      kelilingSellers.push(data);

    }else{

      let k={
        id:Date.now(),
        nama:nama,
        whatsapp:whatsapp,
        username:username,
        password:password,
        wilayah:wilayah,
        aktif:true
      };

      kelilingSellers.push(k);
    }

    localStorage.setItem(
      "aykKelilingSellers",
      JSON.stringify(kelilingSellers)
    );

    toast("Penjual keliling berhasil ditambahkan");

    adminPage(
      "keliling",
      document.querySelectorAll(".tab")[4]
    );

  }catch(e){

    toast("Gagal tambah penjual keliling: "+e.message);

  }
}
async function toggleCourier(id){
let k=couriers.find(x=>String(x.id)===String(id));
  if(!k)return;

  let status=!k.aktif;

  try{
    if(sbReady){
      const {error}=await sb.from("kurir")
        .update({aktif:status})
        .eq("id",id);

      if(error)throw error;
    }

    k.aktif=status;
    localStorage.setItem("aykCouriers",JSON.stringify(couriers));

    toast(status?"Kurir diaktifkan":"Kurir dinonaktifkan");

    adminPage("courier",document.querySelectorAll(".tab")[3]);

  }catch(e){
    toast("Gagal mengubah status kurir: "+e.message);
  }
}
async function toggleKelilingSeller(id){

  let k=kelilingSellers.find(
    x=>String(x.id)===String(id)
  );

  if(!k)return;

  let status=!k.aktif;

  try{

    if(sbReady){

      const {error}=await sb.from("penjual_keliling")
        .update({aktif:status})
        .eq("id",id);

      if(error)throw error;
    }

    k.aktif=status;

    localStorage.setItem(
      "aykKelilingSellers",
      JSON.stringify(kelilingSellers)
    );

    toast(
      status
      ? "Penjual keliling diaktifkan"
      : "Penjual keliling dinonaktifkan"
    );

    adminPage(
      "keliling",
      document.querySelectorAll(".tab")[4]
    );

  }catch(e){

    toast(
      "Gagal mengubah status penjual keliling: "
      +e.message
    );

  }
}
async function changeCourierPassword(id){
  let k=couriers.find(x=>String(x.id)===String(id));
  if(!k)return;

  let newPassword=prompt("Masukkan password baru untuk "+k.nama);

  if(newPassword===null)return;

  newPassword=newPassword.trim();

  if(newPassword.length<6){
    toast("Password minimal 6 karakter");
    return;
  }

  try{
    if(sbReady){
      const {error}=await sb.from("kurir")
        .update({password:newPassword})
        .eq("id",id);

      if(error)throw error;
    }

    k.password=newPassword;
    localStorage.setItem("aykCouriers",JSON.stringify(couriers));

    toast("Password kurir berhasil diganti");

    adminPage("courier",document.querySelectorAll(".tab")[3]);

  }catch(e){
    toast("Gagal mengganti password: "+e.message);
  }
}

async function deleteProductPhoto(id){
  if(adminMode!=="pusat") return toast("Hapus foto dilakukan oleh Admin Pusat");
  if(!sbReady) return toast("Supabase belum tersambung");

  const p=products.find(x=>x.id==id);
  if(!p || !p.foto) return toast("Produk ini belum memiliki foto");

  if(!confirm("Hapus foto produk ini?")) return;

  try{
    const marker="/storage/v1/object/public/produk/";
    let path="";

    try{
      const u=new URL(p.foto);
      const idx=u.pathname.indexOf(marker);
      if(idx>=0){
        path=decodeURIComponent(u.pathname.slice(idx+marker.length));
      }
    }catch(e){}

    if(path){
      const {error}=await sb.storage.from("produk").remove([path]);
      if(error) throw error;
    }

    p.foto="";
    await syncProduct(p);

    save();
    adminApp();
    toast("Foto produk berhasil dihapus");
  }catch(e){
    console.error(e);
    toast("Gagal hapus foto: "+e.message);
  }
}

      date:o.created_at?new Date(o.created_at).toLocaleString("id-ID"):"",
      name:o.nama_pelanggan,
      phone:o.whatsapp,
      address:o.alamat,
      subtotal:Number(o.subtotal||0),
      shipping:Number(o.ongkir||0),
      shippingZone:o.zona,
      total:Number(o.total||0),
      profit:Number(o.profit||0),
      items:o.items||[],
      payment:o.metode_pembayaran,
      status:o.status,
      proof:o.bukti_pembayaran||"",
      branchId:o.cabang_id||"pusat",
      branchName:o.cabang_nama||branchName(o.cabang_id||"pusat"),
      latitude:Number(o.latitude)||null,
      longitude:Number(o.longitude)||null,

      courierId:o.kurir_id||null,
      courierName:o.kurir_nama||"",
      courierStatus:o.status_kurir||"menunggu_kurir"
    }));

    localStorage.setItem("aykOrders",JSON.stringify(orders));

    const list=document.getElementById("orderList");

  }catch(e){
    console.error(e);
    toast("Gagal refresh pesanan: "+e.message);
  }
}

async function upd(id){
  let p=products.find(x=>x.id==id);
  if(!p)return;

  p.stock=+document.getElementById("s"+id).value;
  p.package5k=document.getElementById("pack"+id).checked;
  p.packageUnit=document.getElementById("pu"+id).value.trim()||"250 gram";

  p.operPct=+document.getElementById("oper"+id).value||0;
  p.reservePct=+document.getElementById("reserve"+id).value||0;
  p.profitPct=+document.getElementById("profit"+id).value||0;
  p.priceAdjust=+document.getElementById("adjust"+id).value||0;

  let modal=p.cost||0;
  let oper=modal*p.operPct/100;
  let reserve=modal*p.reservePct/100;
  let profit=modal*p.profitPct/100;

  let hargaHitung=Math.round(modal+oper+reserve+profit);
  p.price=Math.max(0,hargaHitung+p.priceAdjust);

  try{
    await syncProduct(p);
    save();
    toast("Produk & harga jual berhasil diperbarui");
  }catch(e){
    toast("Gagal update Supabase: "+e.message);
  }
}
  function recalcPrice(id){
  let p=products.find(x=>x.id==id);
  if(!p)return;

  let modal=p.cost||0;

  let operPct=+document.getElementById("oper"+id).value||0;
  let reservePct=+document.getElementById("reserve"+id).value||0;
  let profitPct=+document.getElementById("profit"+id).value||0;
  let adjust=+document.getElementById("adjust"+id).value||0;

  let oper=modal*operPct/100;
  let reserve=modal*reservePct/100;
  let profit=modal*profitPct/100;

  let hargaHitung=Math.round(modal+oper+reserve+profit);
  let hargaAplikasi=Math.max(0,hargaHitung+adjust);

  document.getElementById("calc"+id).value=hargaHitung;
  document.getElementById("p"+id).value=hargaAplikasi;
}
